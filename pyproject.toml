[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patenthub"
version = "0.1.0"
description = "Search-first MVP for G06N patent semantic search"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.32,<2",
    "lancedb>=0.6,<1",
    "pyarrow>=18,<22",
    "pydantic>=2,<3",
    "httpx>=0.27,<1",
    "fastembed>=0.3,<1",
    "numpy>=1.26,<3",
    "pandas>=2,<3",
]

[project.optional-dependencies]
ingest = ["sentence-transformers>=3,<4"]
dev = ["pytest>=8,<9", "pytest-mock>=3,<4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
markers = [
    "slow: downloads ML models; run in ingest/parity CI job",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ingest*", "search*", "app*"]